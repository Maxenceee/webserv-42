server
{
	listen 3002;
	server_name localhost;

	root /home/mgama/Desktop/webserv/public;

	location /oui {
		location /oui/non {
			alias /home/mgama/Desktop/webserv/public/router_1;
		}
		root /home/mgama/Desktop/webserv/public/demo;
	}

	location /non {
		alias /home/mgama/Desktop/webserv/public/router_1/upload;
		allow_methods POST;
		# client_max_body_size 5B;
	}
	location / {
		alias /home/mgama/Desktop/webserv/public/demo/views;
		allow_methods GET;
		autoindex off;
		error_page 500 /errors/50x.html;
	}

	error_page 404 /errors/404.html;

	client_max_body_size 10;
}
